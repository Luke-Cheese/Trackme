

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build Android APK on Expo EAS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          
      - name: Configure Mapbox npm registry
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          echo "@rnmapbox:registry=https://api.mapbox.com/downloads/v2/npm/" > .npmrc
          echo "//api.mapbox.com/downloads/v2/npm/:_authToken=${MAPBOX_DOWNLOADS_TOKEN}" >> .npmrc
          
      - name: Install dependencies
        run: npm install

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest



      - name: Build Android APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: eas build --platform android --profile preview --non-interactive --no-wait
